<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specula Elementae - A Card Recognition Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- jsQR per la lettura dei QR code -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<body>

    <header>
      <h1>✨ Specula Elementae</h1>
      <p>Solitario a carte. Nessun click, nessuna tastiera: gioca mostrando le tue carte fisiche alla webcam. Il computer legge e risponde a voce.</p>

    <main>
      <div id="canvas-container"></div>
    </main>
  </div>

  <script src="cards.js"></script>
  <script src="game.js"></script>
  <script src="audio.js"></script>
  <script src="tts.js"></script>
  <script src="sketch.js"></script>

</html>
