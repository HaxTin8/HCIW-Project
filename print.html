<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specula Elementae — Carte da stampare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Beachday';
      src: url('fonts/beachday.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4fbff;
      color: #2b2318;
    }

    .no-print {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: #97B481;
      color: #21361a;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .no-print h1 {
      margin-top: 0;
      font-family: 'Beachday', sans-serif;
      color: #21361a;
    }

    .no-print p {
      margin: 6px 0;
      color: #35502a;
    }

    .no-print button {
      padding: 10px 22px;
      background: #E67E3C;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-family: 'Beachday', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }

    .card-sheet {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      width: 230px;
      height: 340px;
      background: #f1f6fc;
      border-radius: 18px;
      border: 1px solid #dce6f2;
      box-shadow: 0 10px 24px rgba(30,60,90,.12);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
      margin: 0 auto;
      color: #2b2318;
    }

    .card-name {
      font-family: 'Beachday', sans-serif;
      font-weight: 700;
      font-size: 20px;
      text-align: center;
      margin-bottom: 10px;
    }

    .card-medallion-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .card-medallion {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-medallion img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .card-medallion.circle {
      font-size: 52px;
    }

    .card-desc {
      font-size: 13px;
      text-align: center;
      color: #5a4a34;
      padding: 0 6px;
      line-height: 1.4;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .card-desc .vs-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
    }

    .card-qr {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 92px;
      width: 92px;
      background: #fff;
      border: 1px solid #dce6f2;
      border-radius: 10px;
      margin-top: auto;
    }

    .card-qr img {
      max-width: 78px;
      max-height: 78px;
      image-rendering: pixelated;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none;
      }
      body {
        background: #fff;
        padding: 0;
      }
      .card {
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <h1>🖨️ Carte da stampare</h1>
    <p>Ogni carta include il proprio QR code. Usale con Specula Elementae.</p>
    <p>Suggerimento: stampa su carta rigida o plastifica le carte.</p>
    <button onclick="window.print()">Stampa</button>
  </div>

  <div id="sheet" class="card-sheet"></div>

  <script src="cards.js"></script>
  <script>
    const sheet = document.getElementById('sheet');

    function textColorForBg(hex) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.6 ? '#2b2318' : '#fdf6e6';
    }

    // Icona vettoriale per elemento, stessa geometria usata nel gioco (sketch.js).
    function elementIcon(elementId) {
      const name = elementId.toLowerCase();
      return `<img src="assets/elements/${name}.png" alt="${elementId}" style="width: 100%; height: 100%; object-fit: contain;">`;
    }

    // Testo "X batte [icona] e [icona]" generato dai dati reali (strongVs),
    // al posto dei nomi scritti degli elementi battuti.
    function beatsDescription(elementId) {
      const elem = ELEMENTS[elementId];
      const icons = elem.strongVs.map(id => {
        const name = id.toLowerCase();
        return `<img class="vs-icon" src="assets/elements/${name}.png" alt="${ELEMENTS[id].name}" title="${ELEMENTS[id].name}">`;
      });
      return `<span>${elem.name} batte</span> ${icons[0]} <span>e</span> ${icons[1]}`;
    }

    function generateQR(text) {
      const typeNumber = 0;
      const errorCorrectionLevel = 'M';
      const qr = qrcode(typeNumber, errorCorrectionLevel);
      qr.addData(text);
      qr.make();
      return qr.createImgTag(4);
    }

    function createCardElement(template) {
      const card = document.createElement('div');
      card.className = 'card';

      const elem = ELEMENTS[template.element];
      const qrImg = generateQR(template.id);

      card.innerHTML = `
        <div class="card-name" style="color: ${elem.color}">${template.name}</div>
        <div class="card-medallion-wrap">
          <div class="card-medallion" style="background-color: ${elem.color}1a">${elementIcon(template.element)}</div>
        </div>
        <div class="card-desc">${beatsDescription(template.element)}</div>
        <div class="card-qr">${qrImg}</div>
      `;
      return card;
    }

    // Genera due copie di ogni carta base
    for (let i = 0; i < 2; i++) {
      for (const template of CARD_TEMPLATES) {
        sheet.appendChild(createCardElement(template));
      }
    }

    const specialCards = [
      { id: 'RESTART', name: 'Ricomincia', emoji: '🔄', desc: 'Ricomincia la partita.', color: '#1C0A0A' },
      { id: 'SEQUENZIALE', name: 'Sequenziale', emoji: '1️⃣', desc: 'Un nemico per round.', color: '#498AE2' },
      { id: 'SIMULTANEO', name: 'Simultaneo', emoji: '3️⃣', desc: 'Tre nemici per round.', color: '#ECBA4E' }
    ];

    for (const special of specialCards) {
      const card = document.createElement('div');
      card.className = 'card';
      const textColor = textColorForBg(special.color);

      let medallionContent = special.emoji;

      if (special.id === 'RESTART') {
        medallionContent = `<img src="assets/elements/restart.png" alt="Ricomincia" style="width: 80%; height: 80%; object-fit: contain;">`;
      }

      card.innerHTML = `
        <div class="card-name" style="color: ${special.color}">${special.name}</div>
          <div class="card-medallion" style="background-color: ${special.color}1a; font-size: 46px;">${medallionContent}</div>
        </div>
        <div class="card-desc">${special.desc}</div>
        <div class="card-qr">${generateQR(special.id)}</div>
      `;
      sheet.appendChild(card);
    }
  </script>
</body>
</html>
