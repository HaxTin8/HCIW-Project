<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specula Elementae — Carte da stampare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Beachday';
      src: url('fonts/beachday.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Hanken Grotesk', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4fbff;
      color: #2b2318;
    }

    .no-print {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: #97B481;
      color: #21361a;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .no-print h1 {
      margin-top: 0;
      font-family: 'Beachday', 'Space Grotesk', sans-serif;
      color: #21361a;
    }

    .no-print p {
      margin: 6px 0;
      color: #35502a;
    }

    .no-print button {
      padding: 10px 22px;
      background: #E67E3C;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-family: 'Beachday', 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }

    .card-sheet {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      width: 230px;
      height: 340px;
      background: #f1f6fc;
      border-radius: 18px;
      border: 1px solid #dce6f2;
      box-shadow: 0 10px 24px rgba(30,60,90,.12);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
      margin: 0 auto;
      color: #2b2318;
    }

    .card-name {
      font-family: 'Beachday', 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 20px;
      text-align: center;
      margin-bottom: 10px;
    }

    .card-medallion-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .card-medallion {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-medallion img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .card-medallion.circle {
      font-size: 52px;
    }

    .card-desc {
      font-size: 12px;
      text-align: center;
      color: #5a4a34;
      padding: 0 6px;
      line-height: 1.4;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .card-desc .vs-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
    }

    .card-qr {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 92px;
      width: 92px;
      background: #fff;
      border: 1px solid #dce6f2;
      border-radius: 10px;
      margin-top: auto;
    }

    .card-qr img {
      max-width: 78px;
      max-height: 78px;
      image-rendering: pixelated;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none;
      }
      body {
        background: #fff;
        padding: 0;
      }
      .card {
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <h1>🖨️ Carte da stampare</h1>
    <p>Ogni carta include il proprio QR code. Usale con <span data-app-name>Specula Elementae</span>.</p>
    <p>Suggerimento: stampa su carta rigida o plastifica le carte.</p>
    <button onclick="window.print()">Stampa</button>
  </div>

  <div id="sheet" class="card-sheet"></div>

  <script type="module" src="print.js"></script>
</body>
</html>
