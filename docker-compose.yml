services:
  specula-elementae:
    build: .
    container_name: specula-elementae
    ports:
      - "80"
    restart: unless-stopped
    depends_on:
      - specula-piper
    environment:
      APP_PORT: 80
      APP_STATIC_ROOT: /app/dist
      APP_DATA_DIR: /data/app
      PIPER_BASE_URL: http://specula-piper:5000
    volumes:
      - specula_app_data:/data/app

  specula-piper:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    container_name: specula-elementae-piper
    restart: unless-stopped
    environment:
      PIPER_DATA_DIR: /data/voices
      PIPER_PORT: 5000
      PIPER_VOICES: ${PIPER_VOICES:-en_US-lessac-medium}
      PIPER_DEFAULT_VOICE: ${PIPER_DEFAULT_VOICE:-en_US-lessac-medium}
    volumes:
      - piper_voices:/data/voices

volumes:
  piper_voices:
  specula_app_data:
